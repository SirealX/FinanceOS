# render.yaml — Render deployment configuration for FinanceOS backend
# Place this file in the Backend/ directory.
# Commit to Git and connect the repo in the Render dashboard.
#
# After deploying, copy the service URL (e.g. https://financeos.onrender.com)
# and set it as VITE_API_URL in Vercel's environment variables.

services:
  - type: web
    name: financeos-backend
    runtime: python
    pythonVersion: "3.12"     # pin to 3.12 — avoids pydantic-core build failures on 3.14+
    region: oregon            # change to: ohio (US East), frankfurt, singapore, etc.
    plan: free                # upgrade to starter ($7/mo) if you need always-on

    rootDir: .                # render.yaml lives inside Backend/, so "." is correct
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    # ── Health check ────────────────────────────────────────────────────────────
    # /ping returns {"ok":true} instantly — zero DB work, much lighter than /docs.
    # Also used by UptimeRobot to keep this free-tier service alive (see main.py).
    healthCheckPath: /ping

    # ── Environment variables ──────────────────────────────────────────────────
    # Set these in the Render dashboard (Environment tab) — do NOT commit secrets.
    # Listed here as a reference for what the app needs.
    envVars:
      - key: DATABASE_URL
        sync: false           # set manually in dashboard
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false           # set to your Vercel URL after frontend is deployed
      - key: CRON_SECRET
        sync: false           # any random string — protect POST /scheduler/run
      - key: BACKEND_URL
        sync: false           # this service's own public URL — harmless to set even though
                               # nothing on Render calls it anymore (see GitHub Actions cron below)
      - key: TELEGRAM_BOT_TOKEN
        sync: false           # add after creating bot via @BotFather
      - key: VAPID_PUBLIC_KEY
        sync: false           # add after running: npx web-push generate-vapid-keys
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_CONTACT_EMAIL
        sync: false

  # ── Cron job — REMOVED 2026-07-30 ────────────────────────────────────────────
  # Render Cron Jobs have no free tier (start at $1/mo) — this block never actually
  # deployed, which is why Telegram alerts never fired automatically. Replaced with
  # a free GitHub Actions scheduled workflow: see .github/workflows/daily-scheduler.yml
  # at the repo root. That workflow POSTs to /scheduler/run using the same
  # BACKEND_URL + CRON_SECRET values (set as GitHub repo secrets, not here).
